# Include inside the existing Preview TLS server. Preserve configured server_name,
# certificates and TLS termination; do not create a second/unapproved public host.
# The service owns exact CSP, no-store/noindex and immutable hash asset headers.
location = /health-check {
    proxy_pass http://127.0.0.1:4300;
    proxy_set_header Host $host;
    proxy_hide_header X-Powered-By;
    proxy_cache off;
}
location /api/v1/renderers/ {
    proxy_pass http://127.0.0.1:4300;
    proxy_set_header Host $host;
    proxy_cache off;
}
location = /api/v1/renderers {
    proxy_pass http://127.0.0.1:4300;
    proxy_set_header Host $host;
    proxy_cache off;
}
location /preview/ {
    proxy_pass http://127.0.0.1:4300;
    proxy_set_header Host $host;
    proxy_cache off;
}
location / { return 404; }
