name: Preview service

on:
  push:
    branches:
      - main
      - "release/v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: npm test
      - run: npm run check
      - name: Validate deployment compose
        env:
          PREVIEW_IMAGE: ghcr.io/tangtianshuo/independent-website-preview:sha-${{ github.sha }}
          PREVIEW_PUBLIC_ORIGIN: https://preview.example.com
          PREVIEW_ADMIN_ORIGIN: https://cms.example.com
          PREVIEW_APPROVED_ROOT: /opt/novaintelligent/preview
        run: docker compose -f ops/preview.compose.yml config --quiet

  candidate:
    if: startsWith(github.ref, 'refs/heads/release/v')
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/tangtianshuo/independent-website-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Resolve candidate version
        id: version
        run: node -e 'console.log("version=" + require("./package.json").version)' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/tangtianshuo/Independent-Website-Preview
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable deployment image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Candidate only. Manual activation requires the Platform release gate receipt and the same digest." >> "$GITHUB_STEP_SUMMARY"
          echo "PREVIEW_IMAGE=${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
